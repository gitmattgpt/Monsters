<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Drawing AR — Local Compiler</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #000;
    }

    /* ─── Hidden file input ───
       iOS Safari refuses to open the camera for inputs with display:none.
       We keep it rendered but off-screen and transparent. */
    #file-input {
      position: absolute;
      left: -9999px;
      top: 0;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    /* ─── Loading overlay ─── */
    #loading-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.88);
      color: white;
      z-index: 9999;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 24px;
    }
    #loading-overlay.active { display: flex; }

    .spinner {
      border: 4px solid rgba(255, 255, 255, 0.25);
      border-top: 4px solid #fff;
      border-radius: 50%;
      width: 44px;
      height: 44px;
      animation: spin 1s linear infinite;
      margin-bottom: 22px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #progress-text {
      font-size: 17px;
      line-height: 1.5;
      max-width: 300px;
      font-weight: 500;
    }

    /* ─── Detection hint ─── */
    #hint {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      background: rgba(0, 0, 0, 0.7);
      padding: 16px 26px;
      border-radius: 12px;
      font-size: 17px;
      z-index: 9998;
      display: none;
      text-align: center;
      max-width: 80vw;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }
    #hint.visible { display: block; opacity: 1; }
    #hint.fading { opacity: 0; }

    /* ─── Bottom control bar ─── */
    .bottom-bar {
      position: fixed;
      bottom: 20px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      gap: 12px;
      z-index: 10000;
      padding: 0 16px;
      pointer-events: none;
    }
    .bottom-bar button {
      pointer-events: auto;
      padding: 15px 30px;
      font-size: 16px;
      font-weight: 600;
      color: white;
      border: none;
      border-radius: 50px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.15s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .bottom-bar button:active { transform: scale(0.96); }
    .bottom-bar button:disabled { opacity: 0.5; }

    #capture-btn { background: #4CC3D9; }
    #reshoot-btn { background: #e74c3c; }

    /* AR scene is hidden until a target is ready */
    #ar-scene { display: none; }
  </style>
</head>
<body>

  <!-- ═══════════════ UI (must exist before A-Frame loads) ═══════════════ -->

  <input type="file" id="file-input" accept="image/*" capture="environment" />

  <div class="bottom-bar">
    <button id="capture-btn" type="button">📸 Take Photo of Drawing</button>
    <button id="reshoot-btn" type="button" style="display:none;">↻ Re-shoot</button>
  </div>

  <div id="loading-overlay">
    <div class="spinner"></div>
    <div id="progress-text">Processing, please wait…</div>
  </div>

  <div id="hint">Point your camera at your drawing</div>

  <!-- ═══════════════ AR Scene ═══════════════ -->

  <a-scene
    id="ar-scene"
    mindar-image="imageTargetSrc: ; maxTrack: 1; showStats: false; uiLoading: no; uiError: no; uiScanning: no;"
    color-space="sRGB"
    renderer="colorManagement: true; physicallyCorrectLights: true; antialias: true;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    embedded
  >
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity id="target-anchor" mindar-image-target="targetIndex: 0">
      <a-box
        position="0 0 0"
        rotation="0 0 0"
        width="0.5"
        height="0.5"
        depth="0.5"
        color="#4CC3D9"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 4000; easing: linear;"
      ></a-box>
    </a-entity>
  </a-scene>

  <!-- ═══════════════ Libraries (loaded AFTER DOM) ═══════════════ -->

  <script src="https://cdn.jsdelivr.net/npm/@maherboughdiri/mind-ar-compiler@1.0.1/dist/mind-ar-compiler.min.js"></script>
  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

  <!-- ═══════════════ App Logic ═══════════════ -->

  <script>
    'use strict';

    // ─── DOM references ───
    const overlay      = document.getElementById('loading-overlay');
    const progressText = document.getElementById('progress-text');
    const fileInput    = document.getElementById('file-input');
    const captureBtn   = document.getElementById('capture-btn');
    const reshootBtn   = document.getElementById('reshoot-btn');
    const hint         = document.getElementById('hint');
    const arScene      = document.getElementById('ar-scene');
    const targetAnchor = document.getElementById('target-anchor');

    // ═══════════════════════════════════════════════════════════════════
    // IndexedDB cache — stores ArrayBuffers (Safari cannot store Blobs)
    // ═══════════════════════════════════════════════════════════════════

    const DB_NAME    = 'mindar-cache';
    const STORE_NAME = 'targets';
    const DB_VERSION = 1;

    function openDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = () => {
          const db = req.result;
          if (!db.objectStoreNames.contains(STORE_NAME)) {
            db.createObjectStore(STORE_NAME);
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror   = () => reject(req.error);
      });
    }

    async function cacheGet(key) {
      try {
        const db = await openDB();
        return await new Promise((resolve, reject) => {
          const tx  = db.transaction(STORE_NAME, 'readonly');
          const req = tx.objectStore(STORE_NAME).get(key);
          req.onsuccess = () => resolve(req.result || null);
          req.onerror   = () => reject(req.error);
        });
      } catch (err) {
        console.warn('Cache read failed:', err);
        return null;
      }
    }

    async function cachePut(key, arrayBuffer) {
      try {
        const db = await openDB();
        await new Promise((resolve, reject) => {
          const tx  = db.transaction(STORE_NAME, 'readwrite');
          const req = tx.objectStore(STORE_NAME).put(arrayBuffer, key);
          req.onsuccess = () => resolve();
          req.onerror   = () => reject(req.error);
        });
      } catch (err) {
        console.warn('Cache write failed:', err);
      }
    }

    // ═══════════════════════════════════════════════════════════════════
    // Image downscaling — uses plain <canvas>, not OffscreenCanvas,
    // for maximum iOS Safari compatibility.
    // ═══════════════════════════════════════════════════════════════════

    function fileToDataURL(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload  = () => resolve(reader.result);
        reader.onerror = () => reject(reader.error || new Error('FileReader failed'));
        reader.readAsDataURL(file);
      });
    }

    function loadImage(src) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload  = () => resolve(img);
        img.onerror = () => reject(new Error('Image load failed'));
        img.src = src;
      });
    }

    async function downscaleImage(file, maxDim = 640, quality = 0.9) {
      const dataUrl = await fileToDataURL(file);
      const img     = await loadImage(dataUrl);

      const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
      const w = Math.max(1, Math.round(img.width  * scale));
      const h = Math.max(1, Math.round(img.height * scale));

      const canvas = document.createElement('canvas');
      canvas.width  = w;
      canvas.height = h;

      const ctx = canvas.getContext('2d');
      if (!ctx) throw new Error('Canvas 2D context unavailable');
      ctx.drawImage(img, 0, 0, w, h);

      return await new Promise((resolve, reject) => {
        canvas.toBlob(
          (blob) => blob ? resolve(blob) : reject(new Error('toBlob returned null')),
          'image/jpeg',
          quality
        );
      });
    }

    // ═══════════════════════════════════════════════════════════════════
    // Cache key — SHA-256 when available (HTTPS), size+time fallback
    // for plain HTTP LAN testing where crypto.subtle is undefined.
    // ═══════════════════════════════════════════════════════════════════

    async function fileHash(blob) {
      try {
        if (window.crypto && window.crypto.subtle && window.isSecureContext) {
          const buf  = await blob.arrayBuffer();
          const hash = await crypto.subtle.digest('SHA-256', buf);
          return [...new Uint8Array(hash)]
            .map((b) => b.toString(16).padStart(2, '0'))
            .join('');
        }
      } catch (err) {
        console.warn('crypto.subtle hashing failed, using fallback:', err);
      }
      return `fallback-${blob.size}-${blob.type}`;
    }

    // ═══════════════════════════════════════════════════════════════════
    // UI helpers
    // ═══════════════════════════════════════════════════════════════════

    function showLoading(msg) {
      overlay.classList.add('active');
      progressText.textContent = msg;
      captureBtn.style.display = 'none';
      reshootBtn.style.display = 'none';
    }

    function hideLoading() {
      overlay.classList.remove('active');
    }

    function showHint(text) {
      hint.textContent = text;
      hint.classList.remove('fading');
      hint.classList.add('visible');
    }

    function hideHint() {
      hint.classList.add('fading');
      setTimeout(() => {
        hint.classList.remove('visible', 'fading');
      }, 420);
    }

    function resetToCaptureState() {
      arScene.setAttribute('mindar-image', 'imageTargetSrc: ; maxTrack: 1; uiLoading: no; uiError: no; uiScanning: no;');
      arScene.style.display = 'none';
      hideHint();
      reshootBtn.style.display = 'none';
      captureBtn.style.display = 'block';
      fileInput.value = '';
    }

    // ═══════════════════════════════════════════════════════════════════
    // Compiler lookup — the UMD build's global name is undocumented,
    // so we probe the likely candidates.
    // ═══════════════════════════════════════════════════════════════════

    function getCompiler() {
      const candidates = [
        window.mindArCompiler,
        window.MindARCompiler,
        window.compiler,
        window.MINDAR && window.MINDAR.compiler,
      ];
      for (const c of candidates) {
        if (c && typeof c.compileFiles === 'function') return c;
      }
      return null;
    }

    // ═══════════════════════════════════════════════════════════════════
    // Main flow
    // ═══════════════════════════════════════════════════════════════════

    // Trigger file input synchronously inside the tap handler so iOS
    // treats it as a user-initiated gesture. stopPropagation prevents
    // A-Frame's global listeners from swallowing the event.
    captureBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      e.preventDefault();
      fileInput.click();
    });

    reshootBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      e.preventDefault();
      resetToCaptureState();
    });

    fileInput.addEventListener('change', async (event) => {
      const file = event.target.files && event.target.files[0];
      if (!file) {
        // User cancelled the camera / picker
        return;
      }

      showLoading('Processing, please wait…');

      try {
        // ── 1. Downscale ──
        progressText.textContent = 'Preparing image…';
        let downscaled;
        try {
          downscaled = await downscaleImage(file, 640, 0.9);
        } catch (err) {
          console.warn('Downscale failed, using original file:', err);
          downscaled = file;
        }

        // ── 2. Cache lookup ──
        const key = await fileHash(downscaled);
        let targetBuffer = await cacheGet(key);

        if (targetBuffer) {
          progressText.textContent = 'Using cached target…';
        } else {
          // ── 3. Compile ──
          const compiler = getCompiler();
          if (!compiler) {
            throw new Error(
              'MindAR compiler not found. Check that the compiler script loaded.'
            );
          }

          progressText.textContent = 'Processing, please wait…';

          const compiled = await compiler.compileFiles([downscaled], (p) => {
            const pct = Math.max(0, Math.min(100, Math.round(p)));
            progressText.textContent = `Processing… ${pct}%`;
          });

          // Normalize to a plain ArrayBuffer
          if (compiled instanceof ArrayBuffer) {
            targetBuffer = compiled;
          } else if (compiled && compiled.buffer instanceof ArrayBuffer) {
            targetBuffer = compiled.buffer.slice(
              compiled.byteOffset,
              compiled.byteOffset + compiled.byteLength
            );
          } else if (compiled instanceof Uint8Array) {
            targetBuffer = compiled.buffer.slice(
              compiled.byteOffset,
              compiled.byteOffset + compiled.byteLength
            );
          } else {
            throw new Error('Compiler returned an unsupported result type.');
          }

          // ── 4. Cache it ──
          await cachePut(key, targetBuffer);
        }

        // ── 5. Hand the target to MindAR ──
        const blob      = new Blob([targetBuffer], { type: 'application/octet-stream' });
        const targetUrl = URL.createObjectURL(blob);

        arScene.setAttribute(
          'mindar-image',
          `imageTargetSrc: ${targetUrl}; maxTrack: 1; showStats: false; uiLoading: no; uiError: no; uiScanning: no;`
        );

        // ── 6. Swap UI ──
        hideLoading();
        arScene.style.display = 'block';
        reshootBtn.style.display = 'block';
        showHint('Point your camera at your drawing');

      } catch (err) {
        console.error('Compilation failed:', err);
        progressText.textContent =
          'Processing failed. Please try again with a clearer, higher-contrast drawing.';
        setTimeout(() => {
          hideLoading();
          captureBtn.style.display = 'block';
          fileInput.value = '';
        }, 3200);
      }
    });

    // ═══════════════════════════════════════════════════════════════════
    // Hide the hint when the target is actually detected
    // ═══════════════════════════════════════════════════════════════════

    targetAnchor.addEventListener('targetFound', () => {
      hideHint();
    });

    // ═══════════════════════════════════════════════════════════════════
    // Diagnostics — log what's available so you can debug on-device
    // ═══════════════════════════════════════════════════════════════════

    window.addEventListener('load', () => {
      console.log('[DrawingAR] Secure context:', window.isSecureContext);
      console.log('[DrawingAR] crypto.subtle available:', !!(window.crypto && window.crypto.subtle));
      console.log('[DrawingAR] Compiler found:', !!getCompiler());
    });
  </script>
</body>
</html>
